<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Platzhalter-Kursbild, wird durch das endgültige Bild ersetzt (siehe docs/todo.md) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#047857"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- Verbindungen zwischen den Netzwerkknoten -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18">
    <path d="M800 450 L460 260"/>
    <path d="M800 450 L460 640"/>
    <path d="M800 450 L1140 260"/>
    <path d="M800 450 L1140 640"/>
    <path d="M460 260 H1140"/>
  </g>
  <!-- Server-Stapel in der Mitte -->
  <g fill="#ffffff">
    <rect x="690" y="330" width="220" height="70" rx="16"/>
    <rect x="690" y="415" width="220" height="70" rx="16"/>
    <rect x="690" y="500" width="220" height="70" rx="16" fill-opacity="0.85"/>
  </g>
  <g fill="#047857">
    <circle cx="730" cy="365" r="10"/>
    <circle cx="730" cy="450" r="10"/>
    <circle cx="730" cy="535" r="10"/>
  </g>
  <g stroke="#047857" stroke-width="10" stroke-linecap="round">
    <path d="M790 365 H870 M790 450 H870 M790 535 H870"/>
  </g>
  <!-- Knoten: Rechner, Router, Zeitplan, Häkchen -->
  <g fill="#ffffff">
    <rect x="390" y="190" width="140" height="140" rx="28"/>
    <circle cx="1140" cy="260" r="72"/>
    <rect x="390" y="570" width="140" height="140" rx="28" fill-opacity="0.55"/>
    <rect x="1070" y="570" width="140" height="140" rx="70" fill-opacity="0.85"/>
  </g>
  <g fill="none" stroke="#047857" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M425 240 h70 v45 h-70 Z M445 305 h30"/>
    <path d="M1140 220 v40 l28 20"/>
    <path d="M1104 642 l22 22 l44 -44"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.1">
    <circle cx="1450" cy="140" r="160"/>
    <circle cx="120" cy="820" r="200"/>
  </g>
</svg>
